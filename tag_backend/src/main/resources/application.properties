# 应用配置
spring.application.name=tag_backend
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/image_tag_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate 配置
spring.jpa.database=mysql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 文件上传配置
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 文件存储路径
app.file.upload-path=./uploads/

# JWT配置
app.jwt.secret=mySecretKeyForJwtTokenGeneration2024ImageTagSystem
app.jwt.expiration=604800000

# Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Redis连接池配置
spring.data.redis.jedis.pool.max-active=10
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=2
spring.data.redis.jedis.pool.max-wait=3000ms

# 缓存配置
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# API文档配置
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# 日志配置
logging.level.com.example.tag_backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# 跨域配置
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://62.234.94.65:3000,http://62.234.94.65:8080,http://ai-precise.xinxiaohong.com,https://ai-precise.xinxiaohong.com,http://annotation-backend.xinxiaohong.com,https://annotation-backend.xinxiaohong.com,http://annotation-backend.xinxiaohong.linfelix.cn,https://annotation-backend.xinxiaohong.linfelix.cn,http://xinxiaohong.linfelix.cn,https://xinxiaohong.linfelix.cn
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
